name: Build and Publish to Maven

on:
  push:
    branches:
      - develop
      - master
    paths-ignore:
      - 'website/**'
      - 'continuum-js/**'
  pull_request:
    branches:
      - develop
    paths-ignore:
      - 'website/**'
      - 'continuum-js/**'

concurrency:
  group: gradle-build-${{ github.event.pull_request.number || github.ref }}
  # A master run publishes immutable release artifacts for ~1 h; cancelling it mid-way
  # leaves some modules live and the rest unpublished, so master runs queue instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  gradle_build_and_publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          gpg-private-key: ${{ secrets.GPG_KEY_NEW }}
          gpg-passphrase: ${{ secrets.GPG_KEY_PASS_NEW }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties holds the plain version. Effective version by event:
      #   PR           -> <base>-pr<PR#>.<sha>  (pullable image to test the PR)
      #   develop push -> <base>-SNAPSHOT       (development build)
      #   master push  -> <base>                (release, published as-is)
      - name: Determine build version
        id: ver
        run: |
          BASE=$(grep '^continuumVersion=' gradle.properties | cut -d= -f2)
          BASE=${BASE%-SNAPSHOT}
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
            VERSION="${BASE}-pr${{ github.event.pull_request.number }}.${SHORT_SHA}"
            echo "gradle_args=-PcontinuumVersion=${VERSION}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "master" ]]; then
            VERSION="${BASE}"
            echo "gradle_args=-Prelease" >> "$GITHUB_OUTPUT"
          else
            VERSION="${BASE}-SNAPSHOT"
            echo "gradle_args=" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

      - name: Build with Gradle
        id: gradle_build
        continue-on-error: true
        run: ./gradlew build ${{ steps.ver.outputs.gradle_args }}

      - name: Publish to Maven Central with JReleaser
        if: ${{ github.event_name == 'push' && steps.gradle_build.outcome == 'success' }}
        run: ./gradlew publish ${{ steps.ver.outputs.gradle_args }} && ./gradlew jreleaserDeploy --info ${{ steps.ver.outputs.gradle_args }}
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_TOKEN_USERNAME }}
          JRELEASER_MAVENCENTRAL_TOKEN: ${{ secrets.MAVEN_TOKEN_PASSWORD }}
          JRELEASER_NEXUS2_USERNAME: ${{ secrets.MAVEN_TOKEN_USERNAME }}
          JRELEASER_NEXUS2_TOKEN: ${{ secrets.MAVEN_TOKEN_PASSWORD }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_KEY_NEW }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_KEY_PASS_NEW }}

      # Fork and dependabot PRs do not receive the Docker Hub secrets, so only
      # publish images for pushes and same-repo PRs.
      - name: Publish to Docker Hub
        if: ${{ steps.gradle_build.outcome == 'success' && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        run: ./gradlew bootBuildImage --publishImage ${{ steps.ver.outputs.gradle_args }}
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}

#      - name: Run E2E Tests
#        id: run_e2e_tests
#        continue-on-error: true
#        run: |
#          cd continuum-js/continuum-client
#          ./gradlew pnpmInstall
#          ./gradlew pnpmTest

      - name: Merge Test Results
        run: |
          mkdir -p allure-results
          cp -r */build/allure-results/* allure-results/ || true

      - name: Get Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.15
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          subfolder: allure
          allure_report: allure-report
          allure_history: allure-history

      - name: Deploy report to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages
          keep_files: true

      - name: Add status to Commit
        uses: guibranco/github-status-action-v2@v1.1.13
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          context: 'Test Report'
          description: 'Passed'
          state: 'success'
          sha: ${{github.event.pull_request.head.sha || github.sha}}
          target_url: https://mindsignited.github.io/continuum-framework/allure/${{ github.run_number }}

      - name: Check If Failure
        if: ${{ steps.gradle_build.outcome == 'failure' }}
        run: |
          if [ "${{ steps.gradle_build.outcome }}" == "failure" ]; then
            echo "Gradle Build failed."
          fi

          # Optionally mark the job as failed
          exit 1
